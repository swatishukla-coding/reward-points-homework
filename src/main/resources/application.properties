spring.application.name=rewards-program
server.port=8080

# Operational logging.
logging.level.com.charter.reward=INFO

# Async executor used by @Async transaction fetching.
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=rewards-async-

# Expose only the health actuator endpoint for operational checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
